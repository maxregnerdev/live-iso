# MaxRegner OS - Terraform Configuration
# This is the main configuration file for building MaxRegner OS

# ============================================
# ARCHITECTURE CONFIGURATION
# ============================================

# target architecture - i386, amd64, arm64, or leave empty to use host architecture
ARCH=""

# ============================================
# BASE SYSTEM CONFIGURATION
# ============================================

# base codename (Debian sid)
BASECODENAME="sid"

# distribution codename
CODENAME="maxregner"

# distribution version
VERSION="4.4"

# distribution channel
CHANNEL="ultimate"

# distribution name
NAME="MaxRegner OS"

# ============================================
# MIRROR AND REPOSITORY CONFIGURATION
# ============================================

# mirror to fetch packages from
MIRROR_URL="https://repo3.vanillaos.org/20260706T022345Z"

# Additional MaxRegner repositories
MAXREGNER_REPO="https://repo.maxregner.dev/maxregner"
MAXREGNER_REPO_COMPONENTS="main contrib non-free"
MAXREGNER_REPO_SIGNED_BY="/usr/share/keyrings/maxregner-archive-keyring.gpg"

# ============================================
# OUTPUT CONFIGURATION
# ============================================

# suffix for generated .iso files
OUTPUT_SUFFIX="-maxregner-ultimate"

# folder suffix for the package lists to use
PACKAGE_LISTS_SUFFIX="maxregner-ultimate"

# ============================================
# DESKTOP AND UI CONFIGURATION
# ============================================

# desktop environment
DESKTOP_ENVIRONMENT="maxregner"

# Default session
DEFAULT_SESSION="maxregner"

# Theme configuration
THEME_NAME="MaxRegner-Ultimate"
ICON_THEME="MaxRegner-Icons"
CURSOR_THEME="MaxRegner-Cursor"

# ============================================
# LIVE USER CONFIGURATION
# ============================================

# Live user credentials
LIVE_USERNAME="maxregner"
LIVE_PASSWORD="maxregner"
LIVE_FULLNAME="MaxRegner User"
LIVE_HOME="/home/maxregner"
LIVE_SHELL="/bin/bash"
LIVE_GROUPS="sudo,adm,dialout,cdrom,floppy,audio,dip,video,plugdev,netdev"

# Autologin configuration
AUTOLOGIN_ENABLED="true"
AUTOLOGIN_USER="$LIVE_USERNAME"
AUTOLOGIN_TIMEOUT="0"

# ============================================
# BOOT CONFIGURATION
# ============================================

# Boot splash screen
BOOT_SPLASH="maxregner"
BOOT_SPLASH_THEME="maxregner-ultimate"

# Kernel parameters
KERNEL_PARAMETERS="quiet splash bgrt_disable mitigations=off i915.enable_psr=1 i915.enable_fbc=1 pcie_aspm=force drm.vblankoffdelay=1"

# ============================================
# PACKAGE MANAGEMENT CONFIGURATION
# ============================================

# APT configuration
APT_OPTIONS="--yes --option Acquire::Check-Valid-Until=false --option Acquire::Retries=5 --option Acquire::http::Timeout=100"
APT_RECOMMENDS="true"
APT_SUGGESTS="false"

# ============================================
# SECURITY CONFIGURATION
# ============================================

# Enable security features
SECURITY_ENABLED="true"
SECURITY_UPDATES="true"
SECURITY_HARDENING="true"

# AppArmor configuration
APPARMOR_ENABLED="true"
APPARMOR_PROFILE="maxregner"

# ============================================
# PERFORMANCE CONFIGURATION
# ============================================

# CPU governor
CPU_GOVERNOR="performance"

# I/O scheduler
IO_SCHEDULER="bfq"

# Swappiness
VM_SWAPPINESS="10"

# ============================================
# NETWORK CONFIGURATION
# ============================================

# Network manager
NETWORK_MANAGER="NetworkManager"
NETWORK_RENDERER="networkd"

# Hostname
HOSTNAME="maxregner"

# DNS configuration
DNS_SERVERS="1.1.1.1,8.8.8.8,9.9.9.9"

# ============================================
# LOCALIZATION CONFIGURATION
# ============================================

# Default locale
LOCALE="en_US.UTF-8"

# Additional locales
LOCALES="en_US.UTF-8 de_DE.UTF-8 fr_FR.UTF-8 es_ES.UTF-8 it_IT.UTF-8"

# Timezone
TIMEZONE="UTC"

# Keyboard layout
KEYBOARD_LAYOUT="us"
KEYBOARD_MODEL="generic105"
KEYBOARD_VARIANT=""
KEYBOARD_OPTIONS=""

# ============================================
# HARDWARE SUPPORT CONFIGURATION
# ============================================

# Graphics drivers
GRAPHICS_DRIVERS="intel amdgpu nvidia nouveau"

# Firmware
FIRMWARE_ENABLED="true"
FIRMWARE_PACKAGES="linux-firmware firmware-linux firmware-linux-nonfree firmware-iwlwifi firmware-realtek"

# Microcode
MICROCODE_ENABLED="true"
MICROCODE_PACKAGES="intel-microcode amd64-microcode iucode-tool"

# ============================================
# VIRTUALIZATION CONFIGURATION
# ============================================

# Virtualization support
VIRTUALIZATION_ENABLED="true"
VIRTUALIZATION_PACKAGES="qemu-guest-agent open-vm-tools open-vm-tools-desktop virtualbox-guest-utils"

# ============================================
# CLOUD CONFIGURATION
# ============================================

# Cloud-init support
CLOUD_INIT_ENABLED="false"

# ============================================
# DEVELOPMENT CONFIGURATION
# ============================================

# Development tools
DEV_TOOLS_ENABLED="true"
DEV_PACKAGES="git build-essential cmake ninja-build meson python3-dev python3-pip python3-venv"

# ============================================
# GAMING CONFIGURATION
# ============================================

# Gaming support
GAMING_ENABLED="true"
GAMING_PACKAGES="steam lutris wine64 gamemode mangohud corectrl"

# ============================================
# MULTIMEDIA CONFIGURATION
# ============================================

# Multimedia support
MULTIMEDIA_ENABLED="true"
MULTIMEDIA_PACKAGES="vlc gimp audacity blender kdenlive"

# Codecs
CODECS_ENABLED="true"
CODECS_PACKAGES="ffmpeg gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav"

# ============================================
# OFFICE CONFIGURATION
# ============================================

# Office support
OFFICE_ENABLED="true"
OFFICE_PACKAGES="libreoffice libreoffice-gtk3 libreoffice-l10n-de libreoffice-l10n-fr"

# ============================================
# BROWSER CONFIGURATION
# ============================================

# Default browser
BROWSER="firefox-esr"
BROWSER_PACKAGES="firefox-esr chromium-browser"

# ============================================
# EMAIL CONFIGURATION
# ============================================

# Email client
EMAIL_CLIENT="thunderbird"
EMAIL_ENABLED="true"

# ============================================
# INSTALLER CONFIGURATION
# ============================================

# Installer type
INSTALLER="vanilla-installer"
INSTALLER_BRANDING="maxregner"
INSTALLER_THEME="maxregner-ultimate"

# ============================================
# UPDATE CONFIGURATION
# ============================================

# Update policy
UPDATE_POLICY="auto"
UPDATE_FREQUENCY="daily"

# ============================================
# CUSTOM BRANDING CONFIGURATION
# ============================================

# Branding name
BRANDING_NAME="MaxRegner OS"
BRANDING_VERSION="$VERSION"
BRANDING_CODENAME="$CODENAME"
BRANDING_CHANNEL="$CHANNEL"

# Branding files
BRANDING_LOGO="/usr/share/maxregner/branding/logo.png"
BRANDING_WALLPAPER="/usr/share/backgrounds/maxregner/default.jpg"
BRANDING_ICON="/usr/share/icons/maxregner/logo.svg"

# ============================================
# CUSTOM KERNEL CONFIGURATION
# ============================================

# Custom kernel
CUSTOM_KERNEL_ENABLED="false"
CUSTOM_KERNEL_VERSION="6.8.0-maxregner"
CUSTOM_KERNEL_CONFIG="maxregner"

# ============================================
# DEBUG CONFIGURATION
# ============================================

# Debug mode
DEBUG_ENABLED="false"
DEBUG_LEVEL="info"

# ============================================
# EXPERIMENTAL CONFIGURATION
# ============================================

# Experimental features
EXPERIMENTAL_ENABLED="false"
EXPERIMENTAL_PACKAGES=""

# ============================================
# END OF CONFIGURATION
# ============================================

echo "MaxRegner OS Configuration Loaded"
echo "Version: $VERSION"
echo "Codename: $CODENAME"
echo "Channel: $CHANNEL"
echo "Architecture: ${ARCH:-$(dpkg --print-architecture)}"
